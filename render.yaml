# Render blueprint for the CRE8R API.
# Secrets are marked sync:false — set them in the Render dashboard, never here.
services:
  - type: web
    name: cre8r-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # MongoDB Atlas connection string.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      # Comma-separated list of allowed browser origins (the deployed frontend).
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Demo accounts use a published password — keep them out of production.
      - key: SEED_DEMO_USERS
        value: "0"
